<ng-container *ngIf="auth.user$ | async as user; else notLogged">

  <div class="auth-warning">
    <h2>In Progress Tasks</h2>

    <input [(ngModel)]="newTodo" placeholder="New task..." />
    <button (click)="addTodo()">Add</button>
  </div>

    <ul>
      <li *ngFor="let todo of todos$ | async">

        <!--  EDIT MODE -->
        <div *ngIf="editingId === todo.id; else viewMode">
          <input [(ngModel)]="editedText" />
          <button (click)="saveEdit(todo.id)">Save</button>
        </div>

        <!--  VIEW MODE -->
        <ng-template #viewMode>
          {{ todo.text }}

          <button (click)="startEdit(todo)">✏️</button>
          <button (click)="completeTodo(todo.id)">✔</button>
          <button (click)="deleteTodo(todo.id)">🗑️</button>
        </ng-template>

       </li>
    </ul>

</ng-container>

<ng-template #notLogged>
  <div class="auth-warning">
    <h2>Please log in</h2>
    <p>
      Please login to view your todo list or register if you don’t have an account yet.
    </p>

    <button routerLink="/login">Login</button>
    <button routerLink="/register">Register</button>
  </div>
</ng-template>
