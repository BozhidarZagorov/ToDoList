<div class="home-container" *ngIf="user$ | async as user; else loggedOut">
  <div class="home-card">
    <h1>Welcome</h1>
    <h2>{{ user.email }}</h2>

    <p>
      You have 
      <strong>{{ notStartedCount$ | async }}</strong> 
      not started tasks and
      <strong>{{ inProgressCount$ | async }}</strong> 
      tasks in progress 
    </p>

    <button routerLink="/in-progress">View In Progress</button>

    <p>
      And 
      <strong>{{ completedCount$ | async }}</strong> 
      completed tasks
    </p>

    <button routerLink="/completed">View Completed</button>
  </div>
</div>

<ng-template #loggedOut>
  <div class="home-container">
    <div class="home-card">
      <h1>Welcome 👋</h1>
      <p>Please Login to see your todo stats</p>
      <p>or Register to start your todo tasks</p>

      <button routerLink="/login">Login</button>
      <button routerLink="/register">Register</button>
    </div>
  </div>
</ng-template>
