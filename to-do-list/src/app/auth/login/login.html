<div class="auth-container">
  <div class="auth-card">

    <h1>Login</h1>

    <input
      [(ngModel)]="email"
      placeholder="Email"
    />

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
    />

    <div class="button-group">
      <button class="login-btn" (click)="login()">
        Login
      </button>

      <button class="google-btn">
        <img
          src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"
          alt="Google"
        />

        Google
      </button>
    </div>

  </div>
</div>
