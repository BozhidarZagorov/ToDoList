<div class="auth-container">
  <div class="auth-card">

    <h1>Register</h1>

    <input
      [(ngModel)]="email"
      placeholder="Email"
    />

    <input
      [(ngModel)]="password"
      type="password"
      placeholder="Password"
    />

    <button (click)="register()">Register</button>

  </div>
</div>
